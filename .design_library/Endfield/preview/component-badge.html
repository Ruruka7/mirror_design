<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badge — Studio</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--bg); font-family: var(--font-body); color: var(--color-on-surface); }
.row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { width: 92px; font-size: var(--font-size-caption); color: var(--color-muted-foreground); text-transform: uppercase; letter-spacing: .08em; flex-shrink: 0; }
.ctx { font-size: var(--font-size-body); color: var(--color-on-surface); }
.ctx-dim { font-size: var(--font-size-body); color: var(--color-muted-foreground); }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.badge { display: inline-flex; align-items: center; justify-content: center; padding: var(--space-1) var(--space-3); border-radius: var(--radius-full); font-size: var(--font-size-caption); font-weight: var(--font-weight-h4); line-height: var(--line-height-caption); text-transform: uppercase; letter-spacing: var(--tracking-tight); white-space: nowrap; min-width: 38px; flex-shrink: 0; }
.badge-primary { background: var(--endfield-primary-100); color: var(--endfield-primary-900); }
.badge-accent { background: var(--endfield-accent-100); color: var(--endfield-accent-900); }
.badge-tertiary { background: var(--endfield-tertiary-100); color: var(--endfield-tertiary-900); }
.badge-neutral { background: var(--endfield-neutral-800); color: var(--endfield-neutral-100); }
.badge-success { background: var(--endfield-success-100); color: var(--endfield-success-900); }
.badge-error { background: var(--endfield-error-100); color: var(--endfield-error-900); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row">
  <span class="label">色调</span>
  <span class="badge badge-primary" data-evidence-sample="Primary badge">预约</span>
  <span class="badge badge-accent" data-evidence-sample="Accent badge">已确认</span>
  <span class="badge badge-tertiary" data-evidence-sample="Tertiary badge">事件</span>
  <span class="badge badge-neutral" data-evidence-sample="Neutral badge">资讯</span>
  <span class="badge badge-success" data-evidence-sample="success">完成</span>
  <span class="badge badge-error" data-evidence-sample="error">故障</span>
</div>
<hr class="divider">
<div class="row">
  <span class="label">应用场景</span>
  <span class="badge badge-primary">NEW</span>
  <span class="ctx">区域 · 区域 A</span>
  <span class="badge badge-neutral">2026.08</span>
  <span class="ctx-dim">施工进度</span>
  <span class="badge badge-accent">进行中</span>
  <span class="badge badge-error">异常</span>
</div>
</body>
</html>
