<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endfield · Button Preview</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-2); background: var(--color-background); font-family: var(--font-family-base); color: var(--color-on-surface); }
.row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-family: var(--font-mono); font-size: var(--font-size-caption); font-weight: var(--font-weight-eyebrow); letter-spacing: .08em; text-transform: uppercase; color: var(--color-muted-foreground); }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.btn { display: inline-flex; align-items: center; justify-content: center; border: none; cursor: pointer; font-family: var(--font-family-base); text-transform: uppercase; letter-spacing: var(--tracking-tight); transition: var(--transition-fast); clip-path: polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%); flex-shrink: 0; white-space: nowrap; }
.btn-sm { min-height: var(--size-button-sm); min-width: var(--size-button-sm); padding: 0 var(--space-3); font-size: var(--font-size-caption); font-weight: var(--font-weight-eyebrow); }
.btn-md { min-height: var(--size-button-md); min-width: var(--size-button-md); padding: 0 var(--space-5); font-size: var(--font-size-body); font-weight: var(--font-weight-h4); }
.btn-lg { min-height: var(--size-button-lg); min-width: var(--size-button-lg); padding: 0 var(--space-6); font-size: var(--font-size-lead); font-weight: var(--font-weight-h4); }
.btn-primary { background: var(--primary); color: var(--color-on-primary); filter: drop-shadow(var(--shadow-5)); }
.btn-primary:not(:disabled):hover { filter: drop-shadow(var(--shadow-5)) brightness(.92); }
.btn-accent { background: var(--accent); color: var(--color-on-accent); filter: drop-shadow(0 0 .625rem rgba(0,255,162,.3)); }
.btn-accent:not(:disabled):hover { background: var(--accent-hover); }
.btn-outline { background: transparent; color: var(--foreground); border: 2px solid var(--border); }
.btn-outline:not(:disabled):hover { background: var(--color-surface); }
.btn-ghost { background: transparent; color: var(--foreground); clip-path: none; }
.btn-ghost:not(:disabled):hover { color: var(--primary); }
.btn:focus-visible { outline: none; filter: drop-shadow(var(--shadow-5)); }
.btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">主操作</span><button class="btn btn-md btn-primary" data-evidence-sample="Primary medium">立即部署</button><button class="btn btn-md btn-primary" data-evidence-sample="Primary medium" disabled>立即部署</button></div>
<div class="row"><span class="label">确认</span><button class="btn btn-md btn-accent" data-evidence-sample="Accent medium">确认执行</button><button class="btn btn-md btn-accent" data-evidence-sample="Accent medium" disabled>确认执行</button></div>
<div class="row"><span class="label">描边</span><button class="btn btn-md btn-outline" data-evidence-sample="Outline medium">查看档案</button><button class="btn btn-md btn-outline" data-evidence-sample="Outline medium" disabled>查看档案</button></div>
<div class="row"><span class="label">文本</span><button class="btn btn-sm btn-ghost" data-evidence-sample="Ghost small">了解更多</button><button class="btn btn-sm btn-ghost" data-evidence-sample="Ghost small" disabled>了解更多</button></div>
<hr class="divider">
<div class="row"><span class="label">尺寸</span><button class="btn btn-sm btn-primary" data-evidence-sample="Primary medium">部署</button><button class="btn btn-md btn-primary" data-evidence-sample="Primary medium">立即部署</button><button class="btn btn-lg btn-primary" data-evidence-sample="Primary medium">启动作战</button></div>
</body>
</html>
