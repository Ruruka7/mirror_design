<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endfield - Section Navigation</title>
<style>
:root {
  --endfield-bg-primary: #0a0a0a;
  --endfield-bg-secondary: #141414;
  --endfield-bg-tertiary: #1c1c1c;
  --endfield-text-primary: #ffffff;
  --endfield-text-secondary: #a0a0a0;
  --endfield-text-muted: #6a6a6a;
  --endfield-accent: #e8b04b;
  --endfield-accent-hover: #f0c060;
  --endfield-accent-rgb: 232, 176, 75;
  --endfield-border: rgba(255, 255, 255, 0.1);
  --endfield-border-strong: rgba(255, 255, 255, 0.2);
  --endfield-overlay: rgba(0, 0, 0, 0.7);
  --endfield-font-display: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --endfield-font-body: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --endfield-radius: 4px;
  --endfield-radius-lg: 8px;
  --endfield-transition: 0.3s ease;
  --endfield-letter-spacing: 0.05em;
  --endfield-letter-spacing-wide: 0.15em;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--endfield-font-body);
  background: var(--endfield-bg-primary);
  color: var(--endfield-text-primary);
}

/* === Navigation === */
.endfield-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  height: 72px;
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  align-items: center;
  padding: 0 24px;
  background: var(--endfield-overlay);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--endfield-border);
}

.endfield-nav__logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.endfield-nav__logo-text {
  font-family: var(--endfield-font-display);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: var(--endfield-letter-spacing-wide);
  color: var(--endfield-text-primary);
  text-decoration: none;
}

.endfield-nav__logo-sub {
  font-size: 14px;
  font-weight: 400;
  color: var(--endfield-text-secondary);
  letter-spacing: var(--endfield-letter-spacing);
}

.endfield-nav__links {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 32px;
  list-style: none;
}

.endfield-nav__links a {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: var(--endfield-letter-spacing);
  color: var(--endfield-text-secondary);
  text-decoration: none;
  transition: color var(--endfield-transition);
  white-space: nowrap;
}

.endfield-nav__links a:hover,
.endfield-nav__links a:focus,
.endfield-nav__links a.active {
  color: var(--endfield-accent);
}

.endfield-nav__user-area {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 16px;
}

.endfield-nav__btn {
  display: inline-flex;
  align-items: center;
  padding: 8px 20px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: var(--endfield-letter-spacing);
  border: 1px solid var(--endfield-border-strong);
  border-radius: var(--endfield-radius);
  background: transparent;
  color: var(--endfield-text-primary);
  text-decoration: none;
  cursor: pointer;
  transition: all var(--endfield-transition);
}

.endfield-nav__btn:hover {
  border-color: var(--endfield-accent);
  color: var(--endfield-accent);
}

.endfield-nav__btn--primary {
  background: var(--endfield-accent);
  border-color: var(--endfield-accent);
  color: var(--endfield-bg-primary);
}

.endfield-nav__btn--primary:hover {
  background: var(--endfield-accent-hover);
  border-color: var(--endfield-accent-hover);
  color: var(--endfield-bg-primary);
}

.endfield-nav__share {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
}

.endfield-nav__share a {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--endfield-border);
  border-radius: var(--endfield-radius);
  color: var(--endfield-text-secondary);
  text-decoration: none;
  font-size: 14px;
  transition: all var(--endfield-transition);
}

.endfield-nav__share a:hover {
  border-color: var(--endfield-accent);
  color: var(--endfield-accent);
}

/* Mobile hamburger - checkbox hack */
.endfield-nav__toggle {
  display: none;
}

.endfield-nav__hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 36px;
  height: 36px;
  cursor: pointer;
  border: none;
  background: transparent;
}

.endfield-nav__hamburger span {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--endfield-text-primary);
  transition: all var(--endfield-transition);
}

/* Responsive */
@media (max-width: 768px) {
  .endfield-nav__hamburger {
    display: flex;
  }

  .endfield-nav__links {
    position: fixed;
    top: 72px;
    left: 0;
    right: 0;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    padding: 0;
    background: var(--endfield-bg-secondary);
    border-bottom: 1px solid var(--endfield-border);
    max-height: 0;
    overflow: hidden;
    transition: max-height var(--endfield-transition);
  }

  .endfield-nav__links li {
    width: 100%;
    border-bottom: 1px solid var(--endfield-border);
  }

  .endfield-nav__links a {
    display: block;
    width: 100%;
    padding: 16px 24px;
    font-size: 16px;
  }

  .endfield-nav__toggle:checked ~ .endfield-nav__links {
    max-height: 400px;
  }

  .endfield-nav__toggle:checked ~ .endfield-nav__hamburger span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }

  .endfield-nav__toggle:checked ~ .endfield-nav__hamburger span:nth-child(2) {
    opacity: 0;
  }

  .endfield-nav__toggle:checked ~ .endfield-nav__hamburger span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  .endfield-nav__share {
    display: none;
  }

  .endfield-nav__btn {
    padding: 6px 16px;
    font-size: 12px;
  }
}
</style>
</head>
<body>

<!-- ===== Endfield Navigation ===== -->
<header class="endfield-nav">
  <div class="endfield-nav__logo">
    <a href="#home" class="endfield-nav__logo-text">ENDFIELD</a>
    <span class="endfield-nav__logo-sub">终末地</span>
  </div>

  <input type="checkbox" id="nav-toggle" class="endfield-nav__toggle">
  <label for="nav-toggle" class="endfield-nav__hamburger" aria-label="菜单">
    <span></span>
    <span></span>
    <span></span>
  </label>

  <nav class="endfield-nav__links">
    <li><a href="#explore" class="active">探索</a></li>
    <li><a href="#claim">领取</a></li>
    <li><a href="#preregister">预约</a></li>
    <li><a href="#worldview">世界观</a></li>
    <li><a href="#characters">角色</a></li>
    <li><a href="#devteam">开发组</a></li>
  </nav>

  <div class="endfield-nav__user-area">
    <a href="#login" class="endfield-nav__btn">登录</a>
    <a href="#preregister" class="endfield-nav__btn endfield-nav__btn--primary">预约</a>
  </div>

  <div class="endfield-nav__share">
    <a href="#share-weibo" aria-label="微博">微博</a>
    <a href="#share-bilibili" aria-label="哔哩哔哩">B站</a>
  </div>
</header>

</body>
</html>
