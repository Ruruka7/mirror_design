<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endfield - Card Grid Info</title>
<style>
:root {
  --endfield-bg-primary: #0a0a0a;
  --endfield-bg-secondary: #141414;
  --endfield-bg-tertiary: #1c1c1c;
  --endfield-text-primary: #ffffff;
  --endfield-text-secondary: #a0a0a0;
  --endfield-text-muted: #6a6a6a;
  --endfield-accent: #e8b04b;
  --endfield-accent-hover: #f0c060;
  --endfield-accent-rgb: 232, 176, 75;
  --endfield-border: rgba(255, 255, 255, 0.1);
  --endfield-border-strong: rgba(255, 255, 255, 0.2);
  --endfield-overlay: rgba(0, 0, 0, 0.7);
  --endfield-font-display: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --endfield-font-body: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --endfield-radius: 4px;
  --endfield-radius-lg: 8px;
  --endfield-transition: 0.3s ease;
  --endfield-letter-spacing: 0.05em;
  --endfield-letter-spacing-wide: 0.15em;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--endfield-font-body);
  background: var(--endfield-bg-primary);
  color: var(--endfield-text-primary);
}

/* === Card Grid Info Section === */
.endfield-cards {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 80px 24px;
}

.endfield-cards__header {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 48px;
}

.endfield-cards__label {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: var(--endfield-letter-spacing-wide);
  color: var(--endfield-accent);
  text-transform: uppercase;
}

.endfield-cards__title {
  font-family: var(--endfield-font-display);
  font-size: 36px;
  font-weight: 700;
  letter-spacing: var(--endfield-letter-spacing);
  color: var(--endfield-text-primary);
}

.endfield-cards__grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

/* Info Card */
.endfield-info-card {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 32px;
  background: var(--endfield-bg-secondary);
  border: 1px solid var(--endfield-border);
  border-radius: var(--endfield-radius-lg);
  transition: all var(--endfield-transition);
  position: relative;
  overflow: hidden;
}

.endfield-info-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: var(--endfield-accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform var(--endfield-transition);
}

.endfield-info-card:hover {
  border-color: var(--endfield-border-strong);
  background: var(--endfield-bg-tertiary);
}

.endfield-info-card:hover::before {
  transform: scaleX(1);
}

.endfield-info-card__icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  border: 1px solid var(--endfield-border-strong);
  border-radius: var(--endfield-radius);
  font-family: var(--endfield-font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--endfield-accent);
  letter-spacing: var(--endfield-letter-spacing);
}

.endfield-info-card__title {
  font-family: var(--endfield-font-display);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: var(--endfield-letter-spacing);
  color: var(--endfield-text-primary);
}

.endfield-info-card__body {
  font-size: 14px;
  line-height: 1.7;
  color: var(--endfield-text-secondary);
  flex: 1;
}

.endfield-info-card__link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: var(--endfield-letter-spacing);
  color: var(--endfield-accent);
  text-decoration: none;
  transition: gap var(--endfield-transition);
}

.endfield-info-card__link:hover {
  gap: 12px;
}

.endfield-info-card__link-arrow {
  display: inline-block;
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 4px 0 4px 7px;
  border-color: transparent transparent transparent var(--endfield-accent);
}

/* Responsive */
@media (max-width: 768px) {
  .endfield-cards__grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .endfield-cards__title {
    font-size: 28px;
  }

  .endfield-info-card {
    padding: 24px;
  }
}
</style>
</head>
<body>

<!-- ===== Endfield Card Grid Info ===== -->
<section class="endfield-cards" id="industrial-knowledge">
  <div class="endfield-cards__header">
    <span class="endfield-cards__label">INDUSTRIAL KNOWLEDGE</span>
    <h2 class="endfield-cards__title">集成工业知识</h2>
  </div>

  <div class="endfield-cards__grid">
    <article class="endfield-info-card">
      <div class="endfield-info-card__icon">01</div>
      <h3 class="endfield-info-card__title">资源采集</h3>
      <p class="endfield-info-card__body">
        在终末地的各个区域部署采集设施，获取源石、矿物与有机资源。合理规划采集网络是后勤运转的基础。
      </p>
      <a href="#knowledge-1" class="endfield-info-card__link">
        查看详情
        <span class="endfield-info-card__link-arrow"></span>
      </a>
    </article>

    <article class="endfield-info-card">
      <div class="endfield-info-card__icon">02</div>
      <h3 class="endfield-info-card__title">设施建造</h3>
      <p class="endfield-info-card__body">
       利用模块化建造系统，在前线快速搭建作战设施与生产基地。设施的布局与等级直接影响探索效率。
      </p>
      <a href="#knowledge-2" class="endfield-info-card__link">
        查看详情
        <span class="endfield-info-card__link-arrow"></span>
      </a>
    </article>

    <article class="endfield-info-card">
      <div class="endfield-info-card__icon">03</div>
      <h3 class="endfield-info-card__title">装备制造</h3>
      <p class="endfield-info-card__body">
       通过工业链路将采集的原料转化为装备与补给品。高级制造需要解锁对应的技术蓝图与生产线。
      </p>
      <a href="#knowledge-3" class="endfield-info-card__link">
        查看详情
        <span class="endfield-info-card__link-arrow"></span>
      </a>
    </article>
  </div>
</section>

</body>
</html>
