<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endfield - Footer CTA</title>
<style>
:root {
  --endfield-bg-primary: #0a0a0a;
  --endfield-bg-secondary: #141414;
  --endfield-bg-tertiary: #1c1c1c;
  --endfield-text-primary: #ffffff;
  --endfield-text-secondary: #a0a0a0;
  --endfield-text-muted: #6a6a6a;
  --endfield-accent: #e8b04b;
  --endfield-accent-hover: #f0c060;
  --endfield-accent-rgb: 232, 176, 75;
  --endfield-border: rgba(255, 255, 255, 0.1);
  --endfield-border-strong: rgba(255, 255, 255, 0.2);
  --endfield-overlay: rgba(0, 0, 0, 0.7);
  --endfield-overlay-strong: rgba(0, 0, 0, 0.85);
  --endfield-font-display: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --endfield-font-body: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --endfield-radius: 4px;
  --endfield-radius-lg: 8px;
  --endfield-transition: 0.3s ease;
  --endfield-letter-spacing: 0.05em;
  --endfield-letter-spacing-wide: 0.15em;
  --endfield-letter-spacing-ultra: 0.3em;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--endfield-font-body);
  background: var(--endfield-bg-primary);
  color: var(--endfield-text-primary);
}

/* === Footer CTA === */
.endfield-footer {
  position: relative;
  width: 100%;
  padding: 80px 24px 40px;
  background: var(--endfield-bg-secondary);
  border-top: 1px solid var(--endfield-border);
  overflow: hidden;
}

/* Decorative background element */
.endfield-footer__bg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 800px;
  height: 800px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--endfield-accent-rgb), 0.04) 0%, transparent 70%);
  pointer-events: none;
}

.endfield-footer__content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
  max-width: 800px;
  margin: 0 auto;
  text-align: center;
}

.endfield-footer__title {
  font-family: var(--endfield-font-display);
  font-size: clamp(28px, 5vw, 48px);
  font-weight: 700;
  letter-spacing: var(--endfield-letter-spacing-wide);
  color: var(--endfield-text-primary);
  line-height: 1.3;
}

.endfield-footer__subtitle {
  font-size: 15px;
  line-height: 1.8;
  color: var(--endfield-text-secondary);
  max-width: 500px;
}

.endfield-footer__cta-group {
  display: flex;
  flex-direction: row;
  gap: 16px;
}

.endfield-footer__btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 16px 40px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: var(--endfield-letter-spacing);
  border-radius: var(--endfield-radius);
  text-decoration: none;
  cursor: pointer;
  transition: all var(--endfield-transition);
}

.endfield-footer__btn--primary {
  background: var(--endfield-accent);
  border: 1px solid var(--endfield-accent);
  color: var(--endfield-bg-primary);
}

.endfield-footer__btn--primary:hover {
  background: var(--endfield-accent-hover);
  border-color: var(--endfield-accent-hover);
}

.endfield-footer__btn--secondary {
  background: transparent;
  border: 1px solid var(--endfield-border-strong);
  color: var(--endfield-text-primary);
}

.endfield-footer__btn--secondary:hover {
  border-color: var(--endfield-accent);
  color: var(--endfield-accent);
}

/* Footer Links */
.endfield-footer__divider {
  width: 100%;
  height: 1px;
  background: var(--endfield-border);
  margin-top: 48px;
}

.endfield-footer__links {
  display: flex;
  flex-direction: row;
  justify-content: center;
  flex-wrap: wrap;
  gap: 32px;
  margin-top: 32px;
}

.endfield-footer__links a {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: var(--endfield-letter-spacing);
  color: var(--endfield-text-secondary);
  text-decoration: none;
  transition: color var(--endfield-transition);
}

.endfield-footer__links a:hover {
  color: var(--endfield-accent);
}

.endfield-footer__copyright {
  margin-top: 24px;
  font-size: 12px;
  letter-spacing: var(--endfield-letter-spacing);
  color: var(--endfield-text-muted);
}

/* Responsive */
@media (max-width: 768px) {
  .endfield-footer {
    padding: 60px 16px 32px;
  }

  .endfield-footer__cta-group {
    flex-direction: column;
    width: 100%;
    max-width: 320px;
  }

  .endfield-footer__btn {
    width: 100%;
    padding: 14px 32px;
  }

  .endfield-footer__links {
    gap: 20px;
  }
}
</style>
</head>
<body>

<!-- ===== Endfield Footer CTA ===== -->
<footer class="endfield-footer" id="footer-cta">
  <div class="endfield-footer__bg" aria-hidden="true"></div>

  <div class="endfield-footer__content">
    <h2 class="endfield-footer__title">立即预约，开启终末地探索之旅</h2>
    <p class="endfield-footer__subtitle">
      预约即可获得专属奖励，第一时间获取最新资讯与测试资格。
    </p>

    <div class="endfield-footer__cta-group">
      <a href="#preregister" class="endfield-footer__btn endfield-footer__btn--primary">预约</a>
      <a href="#follow" class="endfield-footer__btn endfield-footer__btn--secondary">关注我们</a>
    </div>
  </div>

  <div class="endfield-footer__divider"></div>

  <div class="endfield-footer__links">
    <a href="#about">关于我们</a>
    <a href="#devteam">开发组</a>
    <a href="#privacy">隐私政策</a>
    <a href="#terms">用户协议</a>
    <a href="#community">社区</a>
    <a href="#contact">联系我们</a>
  </div>

  <p class="endfield-footer__copyright">
    © Hypergryph. ENDFIELD 终末地. All Rights Reserved.
  </p>
</footer>

</body>
</html>
