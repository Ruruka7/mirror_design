<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endfield - Version Timeline</title>
<style>
:root {
  --endfield-bg-primary: #0a0a0a;
  --endfield-bg-secondary: #141414;
  --endfield-bg-tertiary: #1c1c1c;
  --endfield-text-primary: #ffffff;
  --endfield-text-secondary: #a0a0a0;
  --endfield-text-muted: #6a6a6a;
  --endfield-accent: #e8b04b;
  --endfield-accent-hover: #f0c060;
  --endfield-accent-rgb: 232, 176, 75;
  --endfield-border: rgba(255, 255, 255, 0.1);
  --endfield-border-strong: rgba(255, 255, 255, 0.2);
  --endfield-overlay: rgba(0, 0, 0, 0.7);
  --endfield-font-display: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --endfield-font-body: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --endfield-radius: 4px;
  --endfield-radius-lg: 8px;
  --endfield-transition: 0.3s ease;
  --endfield-letter-spacing: 0.05em;
  --endfield-letter-spacing-wide: 0.15em;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--endfield-font-body);
  background: var(--endfield-bg-primary);
  color: var(--endfield-text-primary);
}

/* === Version Timeline Section === */
.endfield-timeline {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 80px 24px;
}

.endfield-timeline__header {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 48px;
}

.endfield-timeline__label {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: var(--endfield-letter-spacing-wide);
  color: var(--endfield-accent);
  text-transform: uppercase;
}

.endfield-timeline__title {
  font-family: var(--endfield-font-display);
  font-size: 36px;
  font-weight: 700;
  letter-spacing: var(--endfield-letter-spacing);
  color: var(--endfield-text-primary);
}

.endfield-timeline__track {
  display: flex;
  flex-direction: row;
  gap: 24px;
  overflow-x: auto;
  padding-bottom: 16px;
  scrollbar-width: thin;
  scrollbar-color: var(--endfield-border-strong) transparent;
}

.endfield-timeline__track::-webkit-scrollbar {
  height: 4px;
}

.endfield-timeline__track::-webkit-scrollbar-track {
  background: transparent;
}

.endfield-timeline__track::-webkit-scrollbar-thumb {
  background: var(--endfield-border-strong);
  border-radius: var(--endfield-radius);
}

/* Timeline Item */
.endfield-timeline-item {
  flex: 0 0 280px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.endfield-timeline-item__marker {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
}

.endfield-timeline-item__dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--endfield-accent);
  border: 2px solid var(--endfield-bg-primary);
  box-shadow: 0 0 0 2px var(--endfield-accent);
  flex-shrink: 0;
}

.endfield-timeline-item__line {
  flex: 1;
  height: 1px;
  background: var(--endfield-border-strong);
}

.endfield-timeline-item__date {
  font-family: var(--endfield-font-display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: var(--endfield-letter-spacing-wide);
  color: var(--endfield-accent);
}

.endfield-timeline-item__card {
  padding: 24px;
  background: var(--endfield-bg-secondary);
  border: 1px solid var(--endfield-border);
  border-radius: var(--endfield-radius-lg);
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: border-color var(--endfield-transition);
}

.endfield-timeline-item__card:hover {
  border-color: var(--endfield-border-strong);
}

.endfield-timeline-item__version {
  font-family: var(--endfield-font-display);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: var(--endfield-letter-spacing);
  color: var(--endfield-text-primary);
}

.endfield-timeline-item__desc {
  font-size: 14px;
  line-height: 1.6;
  color: var(--endfield-text-secondary);
}

.endfield-timeline-item__tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}

.endfield-timeline-item__tag {
  padding: 3px 10px;
  font-size: 11px;
  letter-spacing: var(--endfield-letter-spacing);
  border: 1px solid var(--endfield-border-strong);
  border-radius: var(--endfield-radius);
  color: var(--endfield-text-muted);
}

/* Responsive */
@media (max-width: 768px) {
  .endfield-timeline {
    padding: 60px 16px;
  }

  .endfield-timeline__title {
    font-size: 28px;
  }

  .endfield-timeline-item {
    flex: 0 0 240px;
  }

  .endfield-timeline-item__card {
    padding: 20px;
  }
}
</style>
</head>
<body>

<!-- ===== Endfield Version Timeline ===== -->
<section class="endfield-timeline" id="version-calendar">
  <div class="endfield-timeline__header">
    <span class="endfield-timeline__label">VERSION CALENDAR</span>
    <h2 class="endfield-timeline__title">版本日历</h2>
  </div>

  <div class="endfield-timeline__track">
    <div class="endfield-timeline-item">
      <div class="endfield-timeline-item__marker">
        <span class="endfield-timeline-item__dot"></span>
        <span class="endfield-timeline-item__line"></span>
        <span class="endfield-timeline-item__date">2024.03</span>
      </div>
      <div class="endfield-timeline-item__card">
        <span class="endfield-timeline-item__version">首曝公开</span>
        <p class="endfield-timeline-item__desc">终末地项目首次公开，公开首支概念PV。</p>
        <div class="endfield-timeline-item__tags">
          <span class="endfield-timeline-item__tag">PV</span>
          <span class="endfield-timeline-item__tag">公布</span>
        </div>
      </div>
    </div>

    <div class="endfield-timeline-item">
      <div class="endfield-timeline-item__marker">
        <span class="endfield-timeline-item__dot"></span>
        <span class="endfield-timeline-item__line"></span>
        <span class="endfield-timeline-item__date">2024.07</span>
      </div>
      <div class="endfield-timeline-item__card">
        <span class="endfield-timeline-item__version">世界观公开</span>
        <p class="endfield-timeline-item__desc">公开终末地世界观设定与探索部队信息。</p>
        <div class="endfield-timeline-item__tags">
          <span class="endfield-timeline-item__tag">世界观</span>
          <span class="endfield-timeline-item__tag">设定</span>
        </div>
      </div>
    </div>

    <div class="endfield-timeline-item">
      <div class="endfield-timeline-item__marker">
        <span class="endfield-timeline-item__dot"></span>
        <span class="endfield-timeline-item__line"></span>
        <span class="endfield-timeline-item__date">2024.11</span>
      </div>
      <div class="endfield-timeline-item__card">
        <span class="endfield-timeline-item__version">干员情报</span>
        <p class="endfield-timeline-item__desc">首批干员情报公开，展示角色设计与战斗风格。</p>
        <div class="endfield-timeline-item__tags">
          <span class="endfield-timeline-item__tag">干员</span>
          <span class="endfield-timeline-item__tag">角色</span>
        </div>
      </div>
    </div>

    <div class="endfield-timeline-item">
      <div class="endfield-timeline-item__marker">
        <span class="endfield-timeline-item__dot"></span>
        <span class="endfield-timeline-item__line"></span>
        <span class="endfield-timeline-item__date">2025.06</span>
      </div>
      <div class="endfield-timeline-item__card">
        <span class="endfield-timeline-item__version">预约开启</span>
        <p class="endfield-timeline-item__desc">全平台预约正式开启，开放预约专属奖励。</p>
        <div class="endfield-timeline-item__tags">
          <span class="endfield-timeline-item__tag">预约</span>
          <span class="endfield-timeline-item__tag">福利</span>
        </div>
      </div>
    </div>
  </div>
</section>

</body>
</html>
