<!DOCTYPE html>
<html lang="zh-Hans-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenAI — 内容分栏</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    /* ── Content Split (2-column 50-50) ── */
    .content-split {
      max-width: var(--max-content);
      margin: 0 auto;
      padding: var(--space-8) var(--space-5);
    }

    .content-split__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-7);
      align-items: center;
    }

    .content-split__text {
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    .content-split__label {
      display: inline-block;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      background: var(--color-muted);
      color: var(--muted-foreground);
      font-family: var(--font-body);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-caption);
      line-height: var(--line-height-caption);
      align-self: flex-start;
    }

    .content-split__heading {
      margin: 0;
      font-family: var(--font-heading);
      font-size: var(--font-size-h1);
      font-weight: var(--font-weight-h1);
      line-height: var(--line-height-h1);
      letter-spacing: var(--letter-spacing-h1);
      color: var(--color-foreground);
    }

    .content-split__body {
      margin: 0;
      font-family: var(--font-body);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-body);
      line-height: var(--line-height-body);
      letter-spacing: var(--letter-spacing-body);
      color: var(--muted-foreground);
    }

    .content-split__cta {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      align-self: flex-start;
      text-decoration: none;
      color: var(--color-foreground);
      font-family: var(--font-body);
      font-size: var(--font-size-button);
      font-weight: var(--font-weight-button);
      transition: gap 0.2s ease;
    }

    .content-split__cta:hover {
      gap: var(--space-3);
    }

    .content-split__cta svg {
      width: var(--size-icon-sm);
      height: var(--size-icon-sm);
      fill: currentColor;
    }

    .content-split__visual {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 400px;
      border-radius: var(--radius-lg);
      background: var(--color-muted);
      border: 1px solid var(--color-border);
    }

    .content-split__visual svg {
      width: 50%;
      height: auto;
      fill: var(--color-foreground);
      opacity: 0.15;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .content-split {
        padding: var(--space-7) var(--space-5);
      }

      .content-split__grid {
        grid-template-columns: 1fr;
        gap: var(--space-6);
      }

      .content-split__visual {
        min-height: 240px;
        order: -1;
      }
    }

    @media (max-width: 375px) {
      .content-split {
        padding: var(--space-6) var(--space-4);
      }

      .content-split__heading {
        font-size: var(--font-size-h2);
        line-height: var(--line-height-h2);
        letter-spacing: var(--letter-spacing-h2);
      }
    }
  </style>
</head>
<body>

  <section class="content-split">
    <div class="content-split__grid">
      <div class="content-split__text">
        <span class="content-split__label">研究进展</span>
        <h2 class="content-split__heading">推动通用人工智能的前沿研究</h2>
        <p class="content-split__body">我们的研究团队持续在自然语言处理、多模态学习和强化学习等领域取得突破，致力于构建安全、有益且广泛可用的 AI 系统。</p>
        <a href="#" class="content-split__cta">阅读最新研究 <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></a>
      </div>
      <div class="content-split__visual">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-5.0243-2.8817A5.9855 5.9855 0 0 0 12 0a6.0448 6.0448 0 0 0-5.7417 4.1356 5.9847 5.9847 0 0 0-3.9977 2.8817 6.0462 6.0462 0 0 0 .7413 7.152 5.9847 5.9847 0 0 0 .5157 4.9108 6.0462 6.0462 0 0 0 5.0243 2.8817A5.9847 5.9847 0 0 0 12 24a6.0448 6.0448 0 0 0 5.7417-4.1356 5.9847 5.9847 0 0 0 3.9977-2.8817 6.0462 6.0462 0 0 0-.7413-7.152l-.7162-.0096Z"/></svg>
      </div>
    </div>
  </section>

</body>
</html>
