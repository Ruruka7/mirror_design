<!DOCTYPE html>
<html lang="zh-Hans-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenAI — 居中 Hero</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    /* ── Centered Hero ── */
    .hero-centered {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 600px;
      max-width: var(--max-content);
      margin: 0 auto;
      padding: var(--space-8) var(--space-5);
      text-align: center;
      background: var(--color-background);
    }

    .hero-centered__heading {
      margin: 0 0 var(--space-5);
      font-family: var(--font-heading);
      font-size: var(--font-size-h1);
      font-weight: var(--font-weight-h1);
      line-height: var(--line-height-h1);
      letter-spacing: var(--letter-spacing-h1);
      color: var(--color-foreground);
      max-width: 800px;
    }

    .hero-centered__lead {
      margin: 0 0 var(--space-7);
      font-family: var(--font-body);
      font-size: var(--font-size-lead);
      font-weight: var(--font-weight-lead);
      line-height: var(--line-height-lead);
      letter-spacing: var(--letter-spacing-lead);
      color: var(--muted-foreground);
      max-width: 600px;
    }

    .hero-centered__cta-group {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    .hero-centered__cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: var(--size-button-md);
      padding: 0 var(--space-6);
      border-radius: var(--radius-full);
      font-family: var(--font-body);
      font-size: var(--font-size-button);
      font-weight: var(--font-weight-button);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .hero-centered__cta--primary {
      background: var(--color-primary);
      color: var(--color-on-primary);
      border: 1px solid var(--color-primary);
    }

    .hero-centered__cta--primary:hover {
      background: var(--color-primary-hover);
    }

    .hero-centered__cta--secondary {
      background: transparent;
      color: var(--color-foreground);
      border: 1px solid var(--color-border);
    }

    .hero-centered__cta--secondary:hover {
      background: var(--color-muted);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .hero-centered {
        min-height: 400px;
        padding: var(--space-7) var(--space-5);
      }

      .hero-centered__heading {
        font-size: var(--font-size-h2);
        line-height: var(--line-height-h2);
        letter-spacing: var(--letter-spacing-h2);
      }
    }

    @media (max-width: 375px) {
      .hero-centered {
        padding: var(--space-6) var(--space-4);
      }

      .hero-centered__cta-group {
        flex-direction: column;
        width: 100%;
      }

      .hero-centered__cta {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <section class="hero-centered">
    <h1 class="hero-centered__heading">通往 AGI 之路的开创性研究</h1>
    <p class="hero-centered__lead">我们致力于构建造福全人类的安全通用人工智能，推动前沿研究并将其转化为可用的产品。</p>
    <div class="hero-centered__cta-group">
      <a href="#" class="hero-centered__cta hero-centered__cta--primary">与 ChatGPT 对话</a>
      <a href="#" class="hero-centered__cta hero-centered__cta--secondary">开始使用</a>
    </div>
  </section>

</body>
</html>
