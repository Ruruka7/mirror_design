<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation - Studio</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-family-base); color: var(--color-foreground); }
  .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { min-width: 92px; font-size: var(--font-size-caption); font-weight: 500; text-transform: uppercase; letter-spacing: 0.02em; color: var(--color-muted-foreground); }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }
  /* @component-css-start */
  .nav { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 68px; padding: 0 var(--space-5); box-sizing: border-box; flex-shrink: 0; background: transparent; }
  .nav-logo { font-size: 20px; font-weight: 600; color: #000; white-space: nowrap; flex-shrink: 0; letter-spacing: -0.5px; }
  .nav-links { display: flex; align-items: center; gap: var(--space-1); flex-shrink: 0; }
  .nav-link { display: inline-flex; align-items: center; height: 40px; padding: 0 var(--space-2); font-size: 17px; font-weight: 400; color: #000; text-decoration: none; white-space: nowrap; border-radius: 8px; transition: background .15s; flex-shrink: 0; }
  .nav-link:hover { background: rgba(0,0,0,0.04); }
  .nav-actions { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
  .nav-search { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 9999px; background: transparent; color: #000; cursor: pointer; }
  .nav-search:hover { background: rgba(0,0,0,0.04); }
  .nav-search svg { width: 20px; height: 20px; }
  .nav-btn { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 20px; font-size: 14px; font-weight: 500; border-radius: 40px; text-decoration: none; white-space: nowrap; cursor: pointer; transition: background .15s; flex-shrink: 0; }
  .nav-btn--secondary { background: rgba(0,0,0,0.04); color: #000; }
  .nav-btn--secondary:hover { background: rgba(0,0,0,0.08); }
  .nav-btn--primary { background: #000; color: #fff; }
  .nav-btn--primary:hover { background: #333; }
  .nav-menu { width: 40px; height: 40px; display: none; align-items: center; justify-content: center; border: none; border-radius: 8px; background: transparent; color: #000; cursor: pointer; }
  .nav-menu svg { width: 20px; height: 20px; }
  @media (max-width: 768px) {
    .nav-links { display: none; }
    .nav-actions .nav-btn--secondary { display: none; }
    .nav-menu { display: inline-flex; }
  }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row"><span class="label">Desktop</span></div>
  <div class="row">
    <nav class="nav" aria-label="主导航" data-evidence-sample="desktop/default">
      <div class="nav-logo">Studio</div>
      <div class="nav-links" data-evidence-sample="link/default">
        <a href="#" class="nav-link">研究</a>
        <a href="#" class="nav-link">产品</a>
        <a href="#" class="nav-link">安全</a>
        <a href="#" class="nav-link">公司</a>
      </div>
      <div class="nav-actions">
        <button class="nav-search" aria-label="搜索"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
        <a href="#" class="nav-btn nav-btn--secondary">登录</a>
        <a href="#" class="nav-btn nav-btn--primary">开始体验</a>
      </div>
    </nav>
  </div>
  <hr class="divider">
  <div class="row"><span class="label">Mobile</span></div>
  <div class="row">
    <nav class="nav" aria-label="主导航" data-evidence-sample="mobile/default" style="max-width: 375px;">
      <div class="nav-logo">Studio</div>
      <div class="nav-actions">
        <button class="nav-search" aria-label="搜索"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
        <a href="#" class="nav-btn nav-btn--primary">开始体验</a>
        <button class="nav-menu" aria-label="菜单"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
      </div>
    </nav>
  </div>
</body>
</html>
