<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input - Studio</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-family-base); color: var(--color-foreground); }
  .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--color-muted-foreground); text-transform: uppercase; white-space: nowrap; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }
  /* @component-css-start */
  .chat-input { display: flex; align-items: center; gap: var(--space-2); width: 100%; max-width: 720px; min-height: 56px; padding: 16px 52px 16px 16px; background: #fff; border-radius: 24px; box-shadow: 0 3px 6px rgba(0,0,0,0.04), 0 4px 80px 8px rgba(0,0,0,0.04), 0 0 1px rgba(0,0,0,0.62); box-sizing: border-box; position: relative; transition: box-shadow .15s; }
  .chat-input:focus-within { box-shadow: 0 3px 6px rgba(0,0,0,0.06), 0 4px 80px 8px rgba(0,0,0,0.06), 0 0 1px rgba(0,0,0,0.72); }
  .chat-input textarea { flex: 1; min-width: 0; min-height: 24px; max-height: 200px; border: none; background: transparent; color: inherit; font-family: inherit; font-size: 16px; line-height: 24px; outline: none; resize: none; }
  .chat-input textarea::placeholder { color: rgba(0,0,0,0.4); }
  .chat-input__send { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 9999px; background: #000; color: #fff; cursor: pointer; transition: background .15s; }
  .chat-input__send:hover { background: #333; }
  .chat-input__send svg { width: 16px; height: 16px; }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">默认</span>
    <div class="chat-input" data-evidence-sample="default">
      <textarea rows="1" placeholder="输入消息"></textarea>
      <button class="chat-input__send" type="button" aria-label="发送">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>
  <div class="row">
    <span class="label">聚焦</span>
    <div class="chat-input" data-evidence-sample="focus">
      <textarea rows="1" placeholder="输入消息" autofocus></textarea>
      <button class="chat-input__send" type="button" aria-label="发送">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>
  <div class="row">
    <span class="label">已填</span>
    <div class="chat-input" data-evidence-sample="filled">
      <textarea rows="1">帮我写一个前端组件</textarea>
      <button class="chat-input__send" type="button" aria-label="发送">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>
</body>
</html>
