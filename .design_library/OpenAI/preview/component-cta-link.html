<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTA Link - OpenAI</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-family-base); color: var(--color-foreground); }
  .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--color-muted-foreground); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }
  /* @component-css-start */
  .cta-link { display: inline-flex; align-items: center; gap: 4px; color: #000; text-decoration: none; cursor: pointer; transition: opacity .15s; flex-shrink: 0; white-space: nowrap; }
  .cta-link:hover { opacity: 0.7; }
  .cta-link:focus-visible { outline: 2px solid var(--color-ring); outline-offset: 2px; }
  .cta-link--md { font-size: 14px; font-weight: 500; }
  .cta-link--lg { font-size: 17px; font-weight: 500; }
  .cta-link__icon { flex-shrink: 0; width: 16px; height: 16px; }
  .cta-link--lg .cta-link__icon { width: 18px; height: 18px; }
  .cta-link--external .cta-link__icon { width: 14px; height: 14px; }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">默认</span>
    <a href="#" class="cta-link cta-link--md" data-evidence-sample="default">查看更多<img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/arrow-right.svg" width="16" height="16" alt="" class="cta-link__icon"></a>
  </div>
  <div class="row">
    <span class="label">大号</span>
    <a href="#" class="cta-link cta-link--lg" data-evidence-sample="large">查看全部<img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/arrow-right.svg" width="18" height="18" alt="" class="cta-link__icon"></a>
  </div>
  <div class="row">
    <span class="label">外部链接</span>
    <a href="#" class="cta-link cta-link--md cta-link--external" data-evidence-sample="external">下载<img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/external-link.svg" width="14" height="14" alt="" class="cta-link__icon"></a>
  </div>
</body>
</html>
