<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirror — Card</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <link rel="stylesheet" href="../components.css">
  <style>
    body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-body); }
    .preview { max-width: 1080px; margin: 0 auto; padding: var(--space-7) var(--space-5); }
    .preview h1 { margin: 0; font-family: var(--font-display); font-size: var(--font-size-h1); line-height: var(--line-height-h1); }
    .preview p { color: var(--color-text-secondary); }
    .preview-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-top: var(--space-6); }
    .preview-grid > section { min-height: 240px; }
    .preview-label { margin: 0 0 var(--space-4); font-family: var(--font-mono); font-size: var(--font-size-mono); text-transform: uppercase; }
    @media (max-width: 760px) { .preview-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="preview">
    <p class="mirror-eyebrow">Mirror · Component Preview</p>
    <h1>Card</h1>
    <div class="preview-grid">
      <section class="mirror-card"><p class="preview-label">Editorial / outlined</p><p class="mirror-card__eyebrow">思考 · 2026.08.13</p><h2 class="mirror-card__title">从关键词到发布</h2><p class="mirror-card__body">把研究、写作和发布拆成可回看的内容单元。</p><div class="mirror-card__meta">4 分钟 <span>→</span></div></section>
      <section class="mirror-card mirror-card--heavy"><p class="preview-label">Project / heavy rule</p><p class="mirror-card__eyebrow">OPEN SOURCE</p><h2 class="mirror-card__title">Narrative Engine</h2><p class="mirror-card__body">调度器、多角色代理与扩散机制组成的创作实验。</p><div class="mirror-card__meta">TypeScript · AI Agent</div></section>
      <section class="mirror-card mirror-card--muted"><p class="preview-label">Muted / supporting</p><p class="mirror-card__eyebrow">AI NOTES</p><h2 class="mirror-card__title">快速回顾</h2><p class="mirror-card__body">由 AI 辅助归纳整理，保留核心观点与可复用线索。</p><div class="mirror-card__meta">持续更新</div></section>
    </div>
  </main>
</body>
</html>
