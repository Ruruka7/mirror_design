<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation - Studio</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-body); color: var(--color-on-surface); }
  .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { min-width: 92px; font-size: var(--font-size-caption); font-weight: var(--font-weight-eyebrow); line-height: var(--line-height-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted-foreground); }
  .divider { border: 0; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }
  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .studio-nav { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 72px; padding-inline: var(--space-6); background: var(--color-background); color: var(--color-foreground); border-bottom: 1px solid var(--rule); font-size: var(--font-size-body); box-sizing: border-box; }
  .studio-nav__logo { font-family: var(--font-heading); font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); color: var(--color-primary); text-decoration: none; flex-shrink: 0; }
  .studio-nav__list { display: flex; align-items: center; gap: var(--space-4); list-style: none; margin: 0; padding: 0; }
  .studio-nav__link { display: inline-flex; align-items: center; height: 72px; padding-inline: var(--space-2); color: var(--color-on-surface); text-decoration: none; white-space: nowrap; flex-shrink: 0; box-sizing: border-box; transition: background .15s, border-color .15s; }
  .studio-nav__link:hover { background: var(--accent-hover); }
  .studio-nav__link.is-active { color: var(--color-primary); border-bottom: 2px solid var(--ring); font-weight: var(--font-weight-h4); }
  .studio-nav__utility { display: flex; align-items: center; gap: var(--space-4); flex-shrink: 0; }
  .studio-nav__utility a { color: var(--color-on-surface); text-decoration: none; white-space: nowrap; flex-shrink: 0; transition: background .15s, border-color .15s; }
  .studio-nav__utility a:hover { background: var(--accent-hover); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row"><span class="label">顶部导航</span></div>
  <div class="row">
    <header class="studio-nav" role="banner">
      <a class="studio-nav__logo" href="#">Studio</a>
      <nav class="studio-nav__list" role="navigation" aria-label="主导航">
        <a class="studio-nav__link" href="#">解决方案</a>
        <a class="studio-nav__link" href="#">产品</a>
        <a class="studio-nav__link" href="#">服务</a>
        <a class="studio-nav__link" href="#">案例</a>
        <a class="studio-nav__link" href="#">关于我们</a>
      </nav>
      <div class="studio-nav__utility">
        <a href="#">联系我们</a>
        <a href="#">CN</a>
      </div>
    </header>
  </div>
  <hr class="divider">
  <div class="row"><span class="label">当前页面</span></div>
  <div class="row">
    <header class="studio-nav" role="banner">
      <a class="studio-nav__logo" href="#">Studio</a>
      <nav class="studio-nav__list" role="navigation" aria-label="主导航">
        <a class="studio-nav__link" href="#">解决方案</a>
        <a class="studio-nav__link is-active" href="#" aria-current="page">产品</a>
        <a class="studio-nav__link" href="#">服务</a>
        <a class="studio-nav__link" href="#">案例</a>
        <a class="studio-nav__link" href="#">关于我们</a>
      </nav>
      <div class="studio-nav__utility">
        <a href="#">联系我们</a>
        <a href="#">CN</a>
      </div>
    </header>
  </div>
  <div class="row"><span class="label">滚动状态</span></div>
  <div class="row">
    <header class="studio-nav" role="banner">
      <a class="studio-nav__logo" href="#">Studio</a>
      <nav class="studio-nav__list" role="navigation" aria-label="主导航">
        <a class="studio-nav__link" href="#">解决方案</a>
        <a class="studio-nav__link" href="#">产品</a>
        <a class="studio-nav__link" href="#">服务</a>
        <a class="studio-nav__link" href="#">案例</a>
        <a class="studio-nav__link" href="#">关于我们</a>
      </nav>
      <div class="studio-nav__utility">
        <a href="#">联系我们</a>
        <a href="#">CN</a>
      </div>
    </header>
  </div>
</body>
</html>
