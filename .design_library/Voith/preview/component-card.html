<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card — Studio</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-family-base); color: var(--color-on-surface); }
  .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-3); }
  .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); line-height: var(--line-height-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted-foreground); white-space: nowrap; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .card { width: 100%; display: flex; flex-direction: column; gap: var(--space-3); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-6); box-shadow: var(--shadow-1); }
  .card-tinted { background: var(--bg); border-color: var(--rule); border-radius: var(--radius-md); padding: var(--space-4); box-shadow: none; }
  .card h3 { margin: 0; font-family: var(--font-heading); font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); line-height: var(--line-height-h4); color: var(--color-on-surface); word-break: keep-all; overflow-wrap: break-word; }
  .card p { margin: 0; font-size: var(--font-size-body); line-height: var(--line-height-body); color: var(--color-muted-foreground); }
  .card .eyebrow { font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); line-height: var(--line-height-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-primary); white-space: nowrap; }
  .card .cta { align-self: flex-start; font-size: var(--font-size-body); font-weight: var(--font-weight-body); line-height: var(--line-height-body); color: var(--link); text-decoration: none; transition: filter .15s; }
  .card .cta:hover { filter: brightness(0.92); }
  /* @component-css-end */
</style>
</head>
<body>
<div class="row">
  <span class="label">默认</span>
  <article class="card" data-evidence-sample="Default card">
    <h3>智能制造解决方案</h3>
    <p>为纸浆、造纸、能源与交通行业提供高效、可靠且可持续的工程技术，助力客户实现数字化升级。</p>
    <a class="cta" href="#">了解更多</a>
  </article>
</div>
<hr class="divider">
<div class="row">
  <span class="label">紧凑</span>
  <article class="card card-tinted" data-evidence-sample="Compact tinted card">
    <span class="eyebrow">办公地点</span>
    <h3>区域中心 · 上海</h3>
    <p>上海市 · 示例地址</p>
  </article>
</div>
</body>
</html>
