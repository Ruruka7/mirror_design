<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badge — Studio</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-family-base); color: var(--color-on-surface); }
  .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); line-height: var(--line-height-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted-foreground); }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }
  .rail { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; min-width: 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .badge { display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-full); padding: var(--space-1) var(--space-3); font-size: var(--font-size-caption); font-weight: var(--font-weight-h4); line-height: 1; white-space: nowrap; min-width: 28px; min-height: 28px; }
  .badge-cyan { background: var(--voith-cyan-100); color: var(--voith-cyan-900); }
  .badge-blue { background: var(--voith-blue-100); color: var(--voith-blue-900); }
  .badge-success { background: var(--voith-success-100); color: var(--voith-success-900); }
  .badge-error { background: var(--voith-error-100); color: var(--voith-error-900); }
  .badge-neutral { background: var(--voith-neutral-100); color: var(--voith-neutral-800); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">状态</span>
    <div class="rail">
      <span class="badge badge-neutral" data-evidence-sample="Neutral badge">中国</span>
      <span class="badge badge-success">已上线</span>
      <span class="badge badge-error">售罄</span>
    </div>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">品牌</span>
    <div class="rail">
      <span class="badge badge-cyan" data-evidence-sample="Cyan badge">新品</span>
      <span class="badge badge-cyan" data-evidence-sample="Cyan badge">热门</span>
      <span class="badge badge-blue" data-evidence-sample="Blue badge">官方认证</span>
    </div>
  </div>
</body>
</html>
