<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../colors_and_type.css">
  <title>Input</title>
  <style>
    /* Page scaffold — NOT extracted */
    body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-family-base); color: var(--color-on-surface); }
    .specimen { display: block; }
    .stage { display: flex; flex-direction: column; gap: var(--space-3); }
    .story { display: grid; grid-template-columns: 92px 1fr; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); }
    .rail { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
    .story-label { font-size: var(--font-size-caption); font-weight: var(--font-weight-eyebrow); color: var(--color-muted-foreground); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
    .divider { border: none; border-top: 1px solid var(--rule); margin: 0; }

    /* @component-css-start */
    /* Component definitions — extracted to components.css by deterministic script */
    .input { box-sizing: border-box; width: 240px; flex-shrink: 0; height: var(--size-input-height); padding: 0 var(--space-4); background: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: var(--font-size-body); font-family: var(--font-family-base); line-height: var(--line-height-body); transition: border-color .15s, outline-color .15s, background-color .15s; }
    .input::placeholder { color: var(--muted-foreground); }
    .input:hover:not(:focus):not(:disabled) { border-color: var(--muted); }
    .input:focus { outline: 2px solid var(--ring); outline-offset: 2px; border-color: var(--ring); }
    .input.error { background: var(--voith-error-50); border-color: var(--color-error); }
    .input.error:hover:not(:focus):not(:disabled) { border-color: var(--voith-error-600); }
    .input:disabled { background: var(--voith-neutral-100); color: var(--muted-foreground); border-color: var(--border); cursor: not-allowed; }
    /* @component-css-end */
  </style>
</head>
<body class="specimen">
  <div class="stage">
    <div class="story">
      <span class="story-label">默认</span>
      <div class="rail">
        <input class="input" type="text" placeholder="请输入您的姓名" data-evidence-sample="Default input">
        <input class="input" type="email" value="contact@example.com" data-evidence-sample="Focus input">
      </div>
    </div>

    <hr class="divider">

    <div class="story">
      <span class="story-label">错误</span>
      <div class="rail">
        <input class="input error" type="email" placeholder="请输入有效的邮箱地址" data-evidence-sample="Error input">
      </div>
    </div>
    <div class="story">
      <span class="story-label">禁用</span>
      <div class="rail">
        <input class="input" type="text" placeholder="不可输入" disabled data-evidence-sample="disabled">
      </div>
    </div>
  </div>
</body>
</html>
